<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 635" width="1215" height="952.5" role="img" aria-labelledby="title desc"><title id="title">Miedziańsk 1992 — roboczy plan miasta 6 na 4 kilometry</title><desc id="desc">Plan urbanistyczny fikcyjnego miasta w Dolnym Śląsku. Ustalenia logiczne zatwierdzone, metryczny rozkład propozycją. Rzeka płynie z zachodu na wschód przez Stare Miasto; rosyjski Kwadrat na północnym wschodzie; szpital na południowym wschodzie blisko centrum; fabryki na południowym zachodzie, dworzec na południu.</desc>
